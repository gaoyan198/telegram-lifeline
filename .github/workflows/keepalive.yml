name: telegram-keepalive

on:
  schedule:
    # Every 3 days at 07:00 UTC. Well inside Telegram's 6-month idle window.
    # (GitHub may delay scheduled runs under load; the 3-day cadence has huge margin.)
    - cron: "0 7 */3 * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

concurrency:
  group: telegram-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # needed to push the heartbeat commit in the last step
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run keepalive
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: python keepalive.py

      # GitHub disables scheduled workflows on repos with 60 days of no activity.
      # This repo gets no human commits, so the cron would switch itself off and the
      # keepalive would die silently. A commit per run counts as activity and resets
      # that clock. Runs only if the keepalive above succeeded — a repo whose keepalive
      # is broken should be allowed to go stale rather than fake liveness.
      - name: Heartbeat commit (resets GitHub's 60-day scheduler clock)
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ keepalive ok" >> last-run.txt
          # Keep the log bounded; only the recent history is useful.
          tail -n 60 last-run.txt > last-run.tmp && mv last-run.tmp last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "chore: keepalive heartbeat $(date -u +%F)"
          # Another run may have landed first; rebase rather than fail the job.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
